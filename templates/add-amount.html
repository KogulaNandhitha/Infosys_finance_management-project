<!DOCTYPE html>
<html>
<head>
    <title>Transactions</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
        }

        /* Sidebar styles */
        .sidebar {
            width: 250px;
            height: 100vh;
            background-color: rgb(23, 0, 114);
            color: white;
            padding-top: 20px;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar a {
            padding: 15px;
            text-decoration: none;
            color: white;
            text-align: center;
            margin: 10px 0;
        }

        .sidebar a:hover {
            background-color: rgb(7, 122, 254);
        }

        /* Main content area */
        main {
            margin-left: 270px;
            padding: 20px;
            flex: 1;
        }

        header {
            background-color: rgb(47, 19, 227);
            color: white;
            padding: 10px 20px;
            text-align: center;
        }

        h1 {
            margin: 0;
        }

        form {
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-top: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button {
            background-color: rgb(47, 19, 227);
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #45a049;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        ul li {
            background: white;
            border: 1px solid #ddd;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        ul li a {
            color: #f44336;
        }

        ul li a:hover {
            color: #d32f2f;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <a href="/dashboard">Dashboard</a>
        <a href="/profile">Account</a>
        <a href="/add_goal">Goals</a>
        <a href="/add-amount">BIlls</a>
        <a href="/logout">Logout</a>
    </div>

    <!-- Main content -->
    <main>
        <header>
            <h1>Transactions</h1>
        </header>

        <h2>Your Bills</h2>
        <h3>Add Bill</h3>

        <form action="/add-bill" method="POST">
            <label for="description">Description:</label>
            <input type="text" id="description" name="description" required><br><br>

            <label for="amount">Amount:</label>
            <input type="number" id="amount" name="amount" required><br><br>

            <button type="submit">Add Bill</button>
        </form>

        <ul>
            {% for bill in bills %}
                <li>
                    <span>{{ bill.description }} - ${{ bill.amount }}</span>
                  
                </li>
            {% endfor %}
        </ul>

    </main>

</body>
</html>
