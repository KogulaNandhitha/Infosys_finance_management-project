<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: rgb(179, 204, 243);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        h1 {
            color: #2196F3;
            text-align: center;
        }

        form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #1976D2;
        }

        button:active {
            background-color: #1565C0;
        }
    </style>
    <script>
        function validateForm(event) {
            const username = document.forms["registerForm"]["username"].value;
            const password = document.forms["registerForm"]["password"].value;
            const email = document.forms["registerForm"]["email"].value;

            // Username validation: no numbers or special characters
            const usernameRegex = /^[a-zA-Z_\s]+$/;
            if (!usernameRegex.test(username)) {
                alert("Username must not contain any numbers or special symbols.");
                event.preventDefault();
                return false;
            }

            // Password validation: must be greater than 6 characters
            if (password.length <= 5) {
                alert("Password must be greater than 5 characters.");
                event.preventDefault();
                return false;
            }

            // Email validation: must be a valid email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert("Please enter a valid email address.");
                event.preventDefault();
                return false;
            }

            return true; // Allow form submission if all validations pass
        }
    </script>
</head>
<body>
    <form name="registerForm" method="POST" onsubmit="return validateForm(event)">
        <h1>Register</h1>
        <label for="username">Username:</label>
        <input type="text" name="username" required><br>
        <label for="password">Password:</label>
        <input type="password" name="password" required><br>
        <label for="email">Email:</label>
        <input type="email" name="email" required><br>
        <button type="submit">Register</button>
    </form>
</body>
</html>
