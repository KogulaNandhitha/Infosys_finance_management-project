<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        /* General Body Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 250px;
            height: 100vh;
            background-color: rgb(23, 0, 114);
            color: white;
            padding-top: 20px;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar a {
            padding: 15px;
            text-decoration: none;
            color: white;
            text-align: center;
            margin: 10px 0;
        }

        .sidebar a:hover {
            background-color: rgb(7, 122, 254);
        }

        /* Main Content Styles */
        .main-content {
            margin-left: 250px;
            padding: 20px;
            flex-grow: 1;
        }

        header {
            background-color: rgb(47, 19, 227);
            color: white;
            padding: 10px 20px;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
        }

        .username {
            font-size: 1.2em;
            font-weight: bold;
        }

        .dashboard-options {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .dashboard-box {
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 30px;
            width: 150px;
           
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .dashboard-box:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.2);
        }

        .dashboard-box a {
            text-decoration: none;
            color: rgb(47, 19, 227);
            font-weight: bold;
            padding:30px;
        }

        .dashboard-box a:hover {
            color: rgb(7, 122, 254);
        }
        .chart-container {
            width: 50%;
            max-width: 200px;
            margin: auto;
        }
        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }

            .main-content {
                margin-left: 200px;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .main-content {
                margin-left: 0;
            }
            
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <a href="/dashboard">Dashboard</a>
        <a href="/profile">Account</a>
        <a href="/add_goal">Goals</a>
        <a href="/add-amount">Bills</a>
        <a href="/logout">Logout</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <header>
            <h1>Dashboard</h1>
            <span class="username">Welcome, <span id="username"> {{ user.username }}</span></span>
        </header>

        <div class="dashboard-options">
            <div class="dashboard-box" style="background:rgb(165, 180, 244);">
                <a href="/add-amount">Transactions</a>
            </div>
            <div class="dashboard-box" style="background:rgb(253, 192, 252);">
                <a href="/add_goal">Add Goals</a>
            </div>
            <div class="dashboard-box" style="background:rgb(254, 247, 123);">
                <a href="/profile">Account</a>
            </div>
            <div class="dashboard-box" style="background:rgb(229, 174, 251);">
                <a href="/logout">Logout</a>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="transactionPieChart"></canvas>
        </div>
        <div class="dashboard-options">
            <div class="dashboard-box"  style="background:rgb(180, 255, 255);">
                <h2>Current Balance</h2>
                <p id="current-balance" >${{ balance }}</p>
            </div>
            
            
        
    </div>

    <!-- JavaScript to Handle Username and Pie Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Set username dynamically (fetch or set manually)
           // Replace with dynamic username if needed
        
            // Fetch balance and amount spent from backend
            fetch('/balance-data')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        const { currentBalance, amountSpent } = data.data;
        
                        // Display the fetched values
                        document.getElementById('current-balance').textContent = `$${currentBalance.toFixed(2)}`;
                        document.getElementById('amount-spent').textContent = `$${amountSpent.toFixed(2)}`;
                    } else {
                        alert('Failed to load balance data.');
                    }
                })
                .catch(error => console.error('Error fetching balance data:', error));
        });
        
        document.addEventListener('DOMContentLoaded', function () {
            // Set username dynamically (fetch or set manually)
           

            // Handle Pie Chart
            const ctx = document.getElementById('transactionPieChart').getContext('2d');

            // Fetch transaction data from backend
            fetch('/transaction-data')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        const { added, debited } = data.data;

                        // Create the chart
                        new Chart(ctx, {
                            type: 'pie',
                            data: {
                                labels: ['Added Amount', 'Debited Amount'],
                                datasets: [{
                                    data: [added, debited],
                                    backgroundColor: ['#4CAF50', '#FF5733'],
                                    hoverOffset: 4
                                }]
                            },
                            options: {
                                responsive: true,
                                plugins: {
                                    legend: {
                                        position: 'top'
                                    },
                                    tooltip: {
                                        callbacks: {
                                            label: function (tooltipItem) {
                                                const value = tooltipItem.raw;
                                                return `${tooltipItem.label}: $${value.toFixed(2)}`;
                                            }
                                        }
                                    }
                                }
                            }
                        });
                    } else {
                        alert('Failed to load transaction data.');
                    }
                })
                .catch(error => console.error('Error fetching transaction data:', error));
        });
    </script>
</body>
</html>
